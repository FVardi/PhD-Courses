# Assignment 4 — Self-Supervised Representation Learning for Time Series
# Single source of truth for paths, seeds, regimes and protocol constants.
# Values marked TODO are deliberate decisions still to be confirmed.

# --- External official checkouts (kept outside this repo, referenced by path) ---
# Verified commits required by the assignment. Do not modify these working trees;
# all compatibility/integration code lives under src/methods/.
checkouts:
  root: "C:/Users/au808956/Documents/Repos/Time series repos"
  tloss:
    path: "${checkouts.root}/UnsupervisedScalableRepresentationLearningTimeSeries"
    commit: "4aff592"
  ts2vec:
    path: "${checkouts.root}/ts2vec"
    commit: "b0088e1"
  tfc:
    path: "${checkouts.root}/TFC-pretraining"
    commit: "9667582"

# --- Data ---
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  results: "results"

# TF-C consumes FD-A / FD-B from inside its own checkout (datasets/FD-A, datasets/FD-B).
tfc_data:
  fd_a: "${checkouts.tfc.path}/datasets/FD-A"
  fd_b: "${checkouts.tfc.path}/datasets/FD-B"

# --- Datasets for Parts B-E (official train/test partitions, UCR/UEA) ---
datasets:
  required: [FordA, ArticularyWordRecognition, Epilepsy]
  optional: [FordB]          # Part 7 noisy-condition extension
  meta:
    FordA:                       {n_train: 3601, n_test: 1320, length: 500, channels: 1, classes: 2}
    ArticularyWordRecognition:   {n_train: 275,  n_test: 300,  length: 144, channels: 9, classes: 25}
    Epilepsy:                    {n_train: 137,  n_test: 138,  length: 206, channels: 3, classes: 4}
    FordB:                       {n_train: 3636, n_test: 810,  length: 500, channels: 1, classes: 2}

# --- Protocol ---
# Three fixed seeds. The 10% subset a seed generates is reused by EVERY method.
seeds: [42, 123, 456]

label_regimes: [1.0, 0.1]
label_subset:
  stratified: true
  save_indices: true            # results/label_subsets/{dataset}_seed{seed}.json

# Normalisation/imputation/feature transforms are fit on training data only.
preprocessing:
  scaler: standard              # TODO confirm: per-channel, fit on train split only
  fit_on: train

# --- Downstream probes (Parts B-E) ---
# Report logistic regression and RBF-SVM separately. The RBF-SVM is NOT a linear probe.
probes:
  principal: logistic_regression   # the principal representation test
  tuning:
    method: cv                     # training-only CV; never tune on test
    folds: 5
  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
  rbf_svm:
    C: [0.1, 1, 10, 100]
    gamma: [scale, 0.001, 0.01, 0.1]
  # Fixed a priori, used wherever the label budget makes stratified CV impossible
  # (a class with a single example). Chosen before seeing any result and never
  # re-selected, so a scarce-label cell never borrows a choice made under a larger
  # budget. These are the sklearn defaults. Applies identically in Parts B-E.
  untunable_defaults:
    logistic_regression: {C: 1}
    rbf_svm: {C: 1, gamma: scale}

metrics: [accuracy, macro_f1]      # retain both even when they disagree

# --- Part D: contiguous sensor dropout ---
# Fixed BEFORE examining any result, applied identically to all methods.
corruption:
  proportion: 0.2                 # 100 steps on FordA, 41 on Epilepsy, 29 on AWR; 80% survives
  n_intervals: 1                  # one unbroken outage, not several short gaps: neighbouring
                                  # samples are highly correlated, so scattered gaps are a
                                  # much easier and different failure mode
  interval_start: uniform         # start drawn uniformly per series from the seeded RNG; a
                                  # fixed position risks blanking a systematically (un)informative
                                  # region and turning that choice into the result
  channels: all                   # every channel loses the SAME interval. Blanking one channel
                                  # would cost AWR 2.2% of its data against FordA's 20%, so the
                                  # per-dataset Delta columns would not be comparable
  replacement: train_channel_mean # corruption precedes the per-channel scaler, so this lands at
                                  # exactly 0 after scaling: blanked features contribute nothing
                                  # to a linear probe. That is the gentlest convention for the raw
                                  # baseline (forward-fill would inject a misleading constant), so
                                  # any SSL advantage is not an artefact of the fill
  applies_to: test_only           # a robustness test, not augmentation: models never learn to cope
  seeded_by: dataset_seed         # every method sees the identical corrupted arrays

# --- Part E: TS2Vec masking ablation (FordA) ---
ablation:
  dataset: FordA
  masks: [binomial, continuous]  # binomial = TS2Vec default (p=0.5 per timestamp).
                                 # continuous = checkout defaults n=5 runs, l=0.1 of the crop
                                 # each (~41% covered, runs may overlap); neither is tuned.
                                 # The binomial arm reuses the Part C checkpoints (same code,
                                 # n_iters, seeds); only the continuous arm is trained.
                                 # Both probes are reported; logistic regression is principal
  evaluate_on: [clean, corrupted]
  # Exploratory sensitivity sweep (dev/8b_), declared 2026-09-30 AFTER the main Part E result
  # (no difference at 20% x 1) was seen. It does not replace that result; every cell is
  # reported. Question: does the null hold under heavier dropout (more headroom) and under
  # several shorter gaps (closer to the 5-run continuous training mask)?
  sweep:
    proportions: [0.1, 0.2, 0.4]
    n_intervals: [1, 5]           # 5 non-overlapping blocks of proportion/5 each
    probe: logistic_regression    # the main (linear) probe only

# --- Part F: TF-C FD-A -> FD-B exploratory reproduction ---
tfc_run:
  pretrain_dataset: FD-A
  target_dataset: FD-B
  seed: 42                       # one fully documented seed required
  record: [commands, environment, hardware, data_consumed, training_time, metrics]
